[project]
name = "synapseops"
version = "0.1.0"
description = "Autonomous Infrastructure Intelligence & Self-Healing System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Configuration
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",          # Async PostgreSQL driver
    "greenlet>=3.0.0",          # Required by SQLAlchemy async on Python 3.11+
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",   # Sync PostgreSQL driver for Alembic migrations
    # Cache
    "redis[asyncio]>=5.1.0",
    # HTTP client (simulation health polling)
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.4.0",
    # Observability — Metrics (Phase 3)
    "prometheus-client>=0.21.0",
    # Observability — Tracing (Phase 3)
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",            # Async HTTP client for FastAPI testing
    "pytest-cov>=5.0.0",
    "anyio>=4.6.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# =============================================================================
# Ruff — Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function calls in argument defaults (FastAPI Depends pattern)
    "RUF012", # Mutable class attributes (common with SQLAlchemy)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require running DB/Redis)",
]
addopts = "-v --tb=short"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
