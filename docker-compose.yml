# =============================================================================
# SynapseOps -- Docker Compose (Local Development)
#
# Phase 3: Observability & Telemetry
#
# Core SynapseOps services:
#   - api          : SynapseOps FastAPI backend           :8000
#   - postgres     : PostgreSQL database                  :5432
#   - redis        : Redis cache (shared with simulator)  :6379
#
# Simulated infrastructure (Phase 2):
#   - sim-gateway  : Simulated API gateway                :8100
#   - sim-api      : Simulated API service                :8101
#   - sim-worker   : Simulated worker service             :8102
#
# Observability stack (Phase 3):
#   - prometheus   : Metrics scraping & storage           :9090
#   - grafana      : Metrics visualisation                :3000
#   - jaeger       : Distributed trace backend            :16686 (UI)
#                                                         :4317  (OTLP gRPC)
#
# Usage:
#   Start all:            docker compose up -d
#   View logs:            docker compose logs -f api
#   Prometheus UI:        http://localhost:9090
#   Grafana UI:           http://localhost:3000  (admin / admin)
#   Jaeger UI:            http://localhost:16686
#   Inject a failure:     curl -X POST http://localhost:8000/api/v1/simulation/scenarios/WORKER_CRASH/activate
#   Check sim health:     curl http://localhost:8000/api/v1/simulation/services/health
#   Clear failures:       curl -X DELETE http://localhost:8000/api/v1/simulation/failures
#   Stop all:             docker compose down
#   Destroy volumes:      docker compose down -v
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: synapseops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-synapseops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapseops} -d ${POSTGRES_DB:-synapseops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Cache and simulation failure state store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: synapseops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # SynapseOps API — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: synapseops-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-SynapseOps}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-synapseops}
      POSTGRES_USER: ${POSTGRES_USER:-synapseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      # Simulation service URLs (Phase 2)
      SIM_GATEWAY_URL: http://sim-gateway:8100
      SIM_API_URL: http://sim-api:8101
      SIM_WORKER_URL: http://sim-worker:8102
      SIM_FAILURE_REDIS_KEY: sim:failures
      # Observability (Phase 3)
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: synapseops-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment=${ENVIRONMENT:-development}"
      PROMETHEUS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Simulated Gateway — Phase 2
  # Simulates the API gateway sitting in front of the API service.
  # Emits metrics at :8100/metrics and health at :8100/health.
  # ---------------------------------------------------------------------------
  sim-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: synapseops-sim-gateway
    restart: unless-stopped
    command: >
      uvicorn backend.simulation.services.gateway:app
      --host 0.0.0.0
      --port 8100
      --log-level warning
    ports:
      - "8100:8100"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      SIM_FAILURE_REDIS_KEY: sim:failures
      # Observability (Phase 3)
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: synapseops-sim-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # ---------------------------------------------------------------------------
  # Simulated API Service — Phase 2
  # Simulates the core API service behind the gateway.
  # Emits metrics at :8101/metrics and health at :8101/health.
  # ---------------------------------------------------------------------------
  sim-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: synapseops-sim-api
    restart: unless-stopped
    command: >
      uvicorn backend.simulation.services.api_service:app
      --host 0.0.0.0
      --port 8101
      --log-level warning
    ports:
      - "8101:8101"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      SIM_FAILURE_REDIS_KEY: sim:failures
      # Observability (Phase 3)
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: synapseops-sim-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8101/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # ---------------------------------------------------------------------------
  # Simulated Worker — Phase 2
  # Simulates the background worker service.
  # Emits metrics at :8102/metrics and health at :8102/health.
  # ---------------------------------------------------------------------------
  sim-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: synapseops-sim-worker
    restart: unless-stopped
    command: >
      uvicorn backend.simulation.services.worker:app
      --host 0.0.0.0
      --port 8102
      --log-level warning
    ports:
      - "8102:8102"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      SIM_FAILURE_REDIS_KEY: sim:failures
      # Observability (Phase 3)
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: synapseops-sim-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8102/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # ---------------------------------------------------------------------------
  # Prometheus -- Metrics scraping and storage (Phase 3)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: synapseops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Grafana -- Metrics visualisation (Phase 3)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: synapseops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Jaeger -- Distributed trace backend (Phase 3)
  #
  # All-in-one image for local development:
  #   :16686 -- Jaeger UI (human-readable trace browser)
  #   :4317  -- OTLP gRPC receiver (services export traces here)
  #   :4318  -- OTLP HTTP receiver
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: synapseops-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "10000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
